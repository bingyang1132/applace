[package]
name = "applace-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
autobins = false

[features]
default = []

[dependencies]
applace-core = { path = "../core" }
applace-placer = { path = "../placer" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
gds21 = "0.2"

[[bin]]
name = "run_placement_stage"
path = "src/bin/run_placement_stage.rs"

# Form two: placement from an abstract geometric case (no GDS, no PDK).
[[bin]]
name = "run_abstract_placement"
path = "src/bin/run_abstract_placement.rs"

