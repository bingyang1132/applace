[workspace]
members = [
    "core",
    "io",
    "placer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["APPlace contributors"]
license = "GPL-3.0"
rust-version = "1.82"
repository = "https://github.com/bingyang1132/applace"
homepage = "https://github.com/bingyang1132/applace"
description = "Routing-aware analytical placement for analog circuits: gradient global placement with access-point co-optimization, followed by structure-preserving legalization."
readme = "../README.md"
keywords = ["eda", "placement", "analog", "layout"]
categories = ["science", "simulation"]

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
